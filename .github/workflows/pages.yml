name: Publish daily lottery results
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # MN 1:10 PM, DN 6:10 PM and EN 8:10 PM IST.
    - cron: '40 7 * * *'
    - cron: '40 12 * * *'
    - cron: '40 14 * * *'
    # Resume interrupted polls. Completed draws do not request their source again.
    - cron: '40 8,9,10,11,13,15,16,17 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: lottery-downloader
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: actions/cache/restore@v4
        with:
          path: .result-cache
          key: lottery-results-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lottery-results-v2-
      - name: Publish waiting messages and poll missing PDFs every 10 seconds
        run: npm run build:pages -- --watch --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Preserve downloaded PDFs and completed results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .result-cache
          key: lottery-results-v2-${{ github.run_id }}-${{ github.run_attempt }}
